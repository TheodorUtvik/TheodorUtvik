<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="350" viewBox="0 0 1400 350" role="img" aria-label="Theodor Utvik — Data Science | AI">
  <style>
    .name { font: 800 68px -apple-system, "Inter", "Segoe UI", Helvetica, Arial, sans-serif; fill: #1C1F33; letter-spacing: -1.5px; }
    .sub  { font: 600 27px -apple-system, "Inter", "Segoe UI", Helvetica, Arial, sans-serif; fill: #1C1F33; }
    .bar  { fill: #8A85A6; }
    .in   { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1   { animation-delay: .15s; }
    .d2   { animation-delay: .55s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    .planet { transform-box: fill-box; transform-origin: center; animation: breathe 7s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: scale(1.035); } }
    .moon { animation: float 6s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(9px); } }
    .ring { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: draw 2.4s ease-out .2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .twinkle { animation: tw 3.2s ease-in-out infinite; }
    @keyframes tw { 50% { opacity: .15; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2=".3">
      <stop offset="0" stop-color="#D4D2DF"/>
      <stop offset="1" stop-color="#B3AFC4"/>
    </linearGradient>
    <path id="orbit" d="M1305 53 a237 237 0 1 0 0.01 0"/>
  </defs>

  <rect width="1400" height="350" fill="url(#g)"/>

  <!-- faint stars -->
  <g fill="#F4F3F8">
    <circle cx="180" cy="70" r="2.2" class="twinkle"/>
    <circle cx="330" cy="260" r="1.6" class="twinkle" style="animation-delay:1.1s"/>
    <circle cx="1010" cy="95" r="1.8" class="twinkle" style="animation-delay:.6s"/>
    <circle cx="880" cy="300" r="1.4" class="twinkle" style="animation-delay:2s"/>
    <circle cx="90" cy="215" r="1.6" class="twinkle" style="animation-delay:1.6s"/>
  </g>

  <!-- planet, ring and moons -->
  <circle cx="1305" cy="290" r="237" fill="none" stroke="#F4F3F8" stroke-width="2.2" class="ring"/>
  <circle cx="1305" cy="290" r="165" fill="#1C1F33" class="planet"/>
  <circle cx="1104" cy="62" r="23" fill="#F4F3F8" class="moon"/>
  <circle r="6" fill="#F4F3F8">
    <animateMotion dur="26s" repeatCount="indefinite" rotate="auto"><mpath href="#orbit"/></animateMotion>
  </circle>

  <!-- title -->
  <text x="700" y="168" text-anchor="middle" class="name in d1">Theodor Utvik</text>
  <g class="in d2">
    <rect x="497" y="212" width="30" height="3.5" rx="1.5" fill="#1C1F33"/>
    <text x="541" y="225" class="sub">Data Science</text>
    <rect x="726" y="199" width="2" height="34" class="bar"/>
    <text x="745" y="225" class="sub">AI</text>
  </g>
</svg>
