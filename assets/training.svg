<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-label="Animated terminal: training the Theodor model">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-variant-ligatures: none; }
    .dim { fill: #8A85A6; }
    .txt { fill: #F4F3F8; }
    .teal { fill: #B3AFC4; }
    .amber { fill: #D4D2DF; font-weight: 600; }
    .ok { fill: #B3AFC4; }
    .line { opacity: 0; animation: show .01s linear forwards; }
    .l1 { animation-delay: .3s; }
    .l2 { animation-delay: 1.3s; }
    .l3 { animation-delay: 2.1s; }
    .l4 { animation-delay: 3.4s; }
    .l5 { animation-delay: 4.7s; }
    .l6 { animation-delay: 6.0s; }
    .l7 { animation-delay: 6.8s; }
    @keyframes show { to { opacity: 1; } }

    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0);
           animation: grow 1.1s cubic-bezier(.4,0,.2,1) forwards; }
    .b1 { animation-delay: 2.15s; }
    .b2 { animation-delay: 3.45s; }
    .b3 { animation-delay: 4.75s; }
    @keyframes grow { to { transform: scaleX(1); } }

    .typed { clip-path: inset(0 100% 0 0); animation: type .9s steps(42) .3s forwards; }
    @keyframes type { to { clip-path: inset(0 0 0 0); } }

    .curve { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 4.6s ease-out 2.1s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .dot { opacity: 0; animation: show .01s linear 6.7s forwards, pulse 1.4s ease-in-out 6.7s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 50% { transform: scale(1.8); opacity: .5; } }

    .cursor { opacity: 0; animation: show .01s 6.8s forwards, blink 1s steps(1) 6.8s infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1F33"/>
      <stop offset="1" stop-color="#2B2E48"/>
    </linearGradient>
    <linearGradient id="barfill" x1="0" x2="1">
      <stop offset="0" stop-color="#6E6990"/>
      <stop offset="1" stop-color="#F4F3F8"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B3AFC4" stop-opacity=".25"/>
      <stop offset="1" stop-color="#B3AFC4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="858" height="328" rx="14" fill="url(#bg)" stroke="#343854" stroke-width="2"/>
  <circle cx="26" cy="24" r="6" fill="#FF5F57"/>
  <circle cx="46" cy="24" r="6" fill="#FEBC2E"/>
  <circle cx="66" cy="24" r="6" fill="#28C840"/>
  <text x="430" y="29" text-anchor="middle" class="mono dim" font-size="13">theodor@oslo: ~/career</text>
  <line x1="1" y1="44" x2="859" y2="44" stroke="#343854" stroke-width="2"/>

  <!-- terminal lines -->
  <g class="mono">
    <text x="28" y="80" class="typed"><tspan class="teal">$</tspan><tspan class="txt"> python train.py --model theodor --epochs ∞</tspan></text>

    <text x="28" y="112" class="line l2 txt">loading data <tspan class="dim">..........</tspan> <tspan class="ok">✓</tspan> <tspan class="dim">curiosity, coffee, edge cases</tspan></text>

    <g class="line l3">
      <text x="28" y="148" class="txt">epoch 1/∞ <tspan class="amber">NTNU    </tspan></text>
      <rect x="200" y="135" width="190" height="16" rx="4" fill="#343854"/>
      <rect x="200" y="135" width="190" height="16" rx="4" fill="url(#barfill)" class="bar b1"/>
      <text x="404" y="148" class="dim">loss <tspan class="txt">0.92</tspan></text>
    </g>

    <g class="line l4">
      <text x="28" y="182" class="txt">epoch 2/∞ <tspan class="amber">Codeaco </tspan></text>
      <rect x="200" y="169" width="190" height="16" rx="4" fill="#343854"/>
      <rect x="200" y="169" width="140" height="16" rx="4" fill="url(#barfill)" class="bar b2"/>
      <text x="404" y="182" class="dim">loss <tspan class="txt">0.41</tspan></text>
    </g>

    <g class="line l5">
      <text x="28" y="216" class="txt">epoch 3/∞ <tspan class="amber">BI M.Sc.</tspan></text>
      <rect x="200" y="203" width="190" height="16" rx="4" fill="#343854"/>
      <rect x="200" y="203" width="62" height="16" rx="4" fill="url(#barfill)" class="bar b3"/>
      <text x="404" y="216" class="dim">loss <tspan class="txt">0.18</tspan></text>
    </g>

    <text x="28" y="254" class="line l6"><tspan class="ok">✓</tspan><tspan class="txt"> all tests passed. coffee levels nominal.</tspan></text>
    <text x="28" y="290" class="line l7"><tspan class="teal">$</tspan><tspan class="txt"> ship --to production</tspan></text>
    <rect x="234" y="276" width="9" height="18" fill="#F4F3F8" class="cursor"/>
  </g>

  <!-- loss curve -->
  <g transform="translate(560 70)">
    <rect width="270" height="190" rx="10" fill="#171A2B" stroke="#343854"/>
    <text x="14" y="24" class="mono dim" font-size="12">validation loss</text>
    <g stroke="#343854" stroke-width="1">
      <line x1="14" y1="60" x2="256" y2="60"/>
      <line x1="14" y1="105" x2="256" y2="105"/>
      <line x1="14" y1="150" x2="256" y2="150"/>
    </g>
    <path class="curve" d="M14 44 C 50 60, 70 112, 110 124 S 170 150, 205 158 S 240 163, 256 164"
          fill="none" stroke="#D4D2DF" stroke-width="3" stroke-linecap="round"/>
    <circle class="dot" cx="256" cy="164" r="5" fill="#F4F3F8"/>
    <text x="14" y="180" class="mono dim" font-size="11">2023</text>
    <text x="256" y="180" text-anchor="end" class="mono dim" font-size="11">now</text>
  </g>
</svg>
